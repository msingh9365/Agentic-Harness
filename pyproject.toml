[project]
name = "etl-doctor"
version = "0.1.0"
description = "An LLM agent that diagnoses broken ETL pipelines inside a sandbox, with human approval gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
