[project]
name = "etl-doctor"
version = "0.1.0"
description = "An LLM agent that diagnoses broken ETL pipelines inside a sandbox, with human approval gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pydantic-ai-slim[openai]>=2.57.0",
    "e2b>=2.56.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_doctor", "src/edtools"]

[project.scripts]
etl-doctor = "etl_doctor.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
